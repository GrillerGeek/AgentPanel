[package]
name = "agentpanel"
version = "0.5.1"
description = "AgentPanel — a worktree command center for coding agents"
authors = ["Jason Robey"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "agentpanel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Path scrubbing for the opt-in crash-reporting feature (telemetry.rs).
regex = "1"

# Opt-in crash reporting (docs/superpowers/specs/2026-07-23-crash-reporting-design.md).
# Default features pull in the panic integration + reqwest/native-tls transport.
sentry = "0.42"
# Tauri-v2-compatible plugin (note: the design doc's working name "sentry-tauri"
# refers to this crate's older Tauri-v1-only ancestor of the same name on
# crates.io; `tauri-plugin-sentry` is its Tauri v2 successor by the same author,
# same architecture -- WebView events routed to the Rust SDK over Tauri IPC).
# default-features off: this crate's default "minidump" feature captures native
# crash dumps via a separate crash-reporter process, which is out of scope here
# (spec covers Rust panics + WebView JS exceptions only).
tauri-plugin-sentry = { version = "0.5", default-features = false }
# Direct dependency only so lib.rs can build a `reqwest::Client` with explicit
# connect/request timeouts for `TimeoutTransportFactory` (see lib.rs). The TLS
# backend feature is already enabled via `sentry`'s own dependency edge
# (its default "native-tls" feature); Cargo unifies features across the one
# resolved `reqwest` version in the graph, so this entry doesn't restate it.
reqwest = { version = "0.12", default-features = false }

# Terminal spike (Phase 0): cross-platform PTY -> ConPTY on Windows.
portable-pty = "0.8"
base64 = "0.22"
# Worktree file watching (Phase 2): emit change events to refresh status.
notify = "6"

[target.'cfg(windows)'.dependencies]
# Enumerate installed font families (for the terminal-font picker in Settings).
winreg = "0.52"

[target.'cfg(unix)'.dependencies]
# Process-group signalling for killing the agent's subprocess tree on close.
libc = "0.2"
