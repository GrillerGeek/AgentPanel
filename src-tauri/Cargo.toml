[package]
name = "agentpanel"
version = "0.2.0"
description = "AgentPanel — a worktree command center for coding agents (Windows)"
authors = ["Jason Robey"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "agentpanel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Terminal spike (Phase 0): cross-platform PTY -> ConPTY on Windows.
portable-pty = "0.8"
base64 = "0.22"
# Worktree file watching (Phase 2): emit change events to refresh status.
notify = "6"

[target.'cfg(windows)'.dependencies]
# Enumerate installed font families (for the terminal-font picker in Settings).
winreg = "0.52"
