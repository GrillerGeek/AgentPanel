name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Linux is the newest build target and the one no maintainer runs locally, so
  # it is the one most likely to break silently. release.yml only runs on tags,
  # which would surface a Linux regression halfway through a release. This job
  # makes that a red PR instead.
  linux:
    runs-on: ubuntu-22.04
    env:
      CARGO_NET_RETRY: "10"
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Rust cache
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: "./src-tauri -> target"
          key: linux-check

      # webkit2gtk-sys and friends run pkg-config at build time, so these are
      # needed even for `cargo check` — not just for bundling.
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev

      - name: Install frontend dependencies
        run: npm ci

      # `npm run build` is `tsc && vite build`, so this covers the typecheck and
      # produces ../dist — which tauri-build expects to exist.
      - name: Build frontend (typecheck + dist)
        run: npm run build

      - name: Frontend tests
        run: npm test

      - name: Rust check
        run: cargo check --manifest-path src-tauri/Cargo.toml --all-targets

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Verify and unpack pinned Herdr core test runtime
        shell: bash
        run: |
          curl --fail --location --retry 3 \
            https://releases.herdr.dev/core/0.1.16/herdr-core-linux-x86_64.tar.gz \
            -o "$RUNNER_TEMP/herdr-core.tar.gz"
          printf '%s  %s\n' \
            58d6861176dc6fe905b58880d5bff07a9959be613a98e5d66b4583b04b6cfa45 \
            "$RUNNER_TEMP/herdr-core.tar.gz" | sha256sum --check -
          mkdir -p "$RUNNER_TEMP/herdr-core-test"
          tar -xzf "$RUNNER_TEMP/herdr-core.tar.gz" -C "$RUNNER_TEMP/herdr-core-test"

      - name: Live Linux adapter acceptance in scratch sessions
        run: python3 scripts/spikes/run_herdr_adapter_test.py "$RUNNER_TEMP/herdr-core-test/herdr-core"

      - name: SSH attachment and recovery against disposable Linux guest
        timeout-minutes: 10
        run: python3 scripts/spikes/run_herdr_ssh_test.py "$RUNNER_TEMP/herdr-core-test/herdr-core"

  desktop:
    name: ${{ matrix.os }} build and tests
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: "./src-tauri -> target"
          key: desktop-check-${{ matrix.os }}
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: cargo check --manifest-path src-tauri/Cargo.toml --all-targets
      - run: cargo test --manifest-path src-tauri/Cargo.toml
