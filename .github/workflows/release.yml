name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # Fail the whole release fast (on one cheap runner) if the manifests disagree
  # with each other or with the pushed tag. This catches the class of mistake
  # where a merge silently reverts a version bump — a v0.2.2 tag must build
  # manifests that all say 0.2.2.
  verify-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Check manifest versions match the tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(jq -r .version package.json)
          lock=$(jq -r .version package-lock.json)
          lockpkg=$(jq -r '.packages[""].version' package-lock.json)
          conf=$(jq -r .version src-tauri/tauri.conf.json)
          cargo=$(grep -m1 '^version' src-tauri/Cargo.toml | sed -E 's/^version *= *"(.*)".*/\1/')
          # Cargo.lock records the crate's own version in its [[package]] block.
          # Match the block by exact name, then take the version line that follows.
          cargolock=$(awk -F'"' '/^name = "agentpanel"$/ { found = 1; next } found && /^version = / { print $2; exit }' src-tauri/Cargo.lock)
          echo "tag=$tag  package.json=$pkg  package-lock.json=$lock  tauri.conf.json=$conf  Cargo.toml=$cargo  Cargo.lock=$cargolock"
          fail=0
          if [ -z "$cargolock" ]; then
            echo "::error file=src-tauri/Cargo.lock::no [[package]] entry named 'agentpanel' found — the crate was renamed or the lockfile is malformed"
            fail=1
          fi
          for pair in "package.json:$pkg" "package-lock.json:$lock" "tauri.conf.json:$conf" "Cargo.toml:$cargo" "Cargo.lock:$cargolock"; do
            name="${pair%%:*}"; val="${pair#*:}"
            if [ "$val" != "$tag" ]; then
              echo "::error file=$name::$name version is '$val' but the tag is 'v$tag'"
              fail=1
            fi
          done
          # package-lock.json stores the version twice and npm keeps both fields
          # in sync; a mismatch means it was hand-edited instead of regenerated.
          if [ "$lockpkg" != "$lock" ]; then
            echo "::error file=package-lock.json::packages[\"\"].version is '$lockpkg' but the top-level version is '$lock'"
            fail=1
          fi
          if [ "$fail" -ne 0 ]; then
            echo "Manifest versions must all equal the tag. Bump them and re-tag."
            echo "Refresh the lockfiles rather than hand-editing them:"
            echo "  npm install --package-lock-only"
            echo "  cargo check --manifest-path src-tauri/Cargo.toml"
            exit 1
          fi
          echo "All manifest versions match the tag ($tag)."

  build:
    needs: verify-version
    strategy:
      fail-fast: false
      # Each leg publishes its artifacts by read-modify-writing the release's
      # shared latest.json. Run them one at a time so those writes can't
      # interleave: at v0.6.0 three concurrent legs raced and GitHub ended up
      # with *two* assets both named latest.json, holding disjoint platform
      # sets (darwin-aarch64 in one; darwin-x86_64 + windows-x86_64 in the
      # other). Whichever one won, a platform would have silently stopped
      # receiving updates. Serial releases cost ~15 extra minutes; a split
      # manifest costs a platform's entire update channel.
      max-parallel: 1
      matrix:
        include:
          # Apple Silicon. Deliberately left without an explicit --target so the
          # artifact names and updater keys stay byte-for-byte what v0.5.1 shipped.
          - platform: macos-latest
            args: ""
            rust-target: ""
          # Intel. `macos-latest` is an arm64 runner, so this leg cross-compiles.
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
            rust-target: "x86_64-apple-darwin"
          - platform: windows-latest
            args: ""
            rust-target: ""

    runs-on: ${{ matrix.platform }}

    # Transient crates.io download failures ("curl failed" fetching a crate
    # source) have flaked release builds. Retry network operations aggressively
    # so a one-off registry hiccup doesn't fail an otherwise-good release.
    env:
      CARGO_NET_RETRY: "10"
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      # The `secrets` context is not allowed in step `if:` expressions, so the
      # Sentry gate is evaluated here (env values may reference secrets) and
      # steps test the resulting env var instead.
      SENTRY_ENABLED: ${{ secrets.SENTRY_AUTH_TOKEN != '' }}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          # Empty on the native legs: the action's `for t in ${targets//,/ }` loop
          # simply doesn't iterate, so no --target flag is added.
          targets: ${{ matrix.rust-target }}

      - name: Rust cache
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: "./src-tauri -> target"
          # Both macOS legs share a job id and runner OS. Without a distinct key
          # they collide on one cache entry and thrash it every run.
          key: ${{ matrix.rust-target }}

      - name: Install frontend dependencies
        run: npm ci

      # Crash reporting (docs/superpowers/specs/2026-07-23-crash-reporting-design.md):
      # builds once here so minified-JS stack traces can be mapped back to
      # source in Sentry. Conditional on the secret so forks (which don't have
      # it) still build releases; the actual bundled build's source maps are
      # stripped before packaging regardless (tauri.conf.json's
      # `beforeBundleCommand` / scripts/strip-sourcemaps.mjs), so this step
      # never causes maps to ship inside the installer either way.
      - name: Build web assets (for source-map upload)
        if: ${{ env.SENTRY_ENABLED == 'true' }}
        run: npm run build

      - name: Upload source maps to Sentry
        if: ${{ env.SENTRY_ENABLED == 'true' }}
        # bash explicitly: this script uses bash syntax (line continuations,
        # ${VAR#v} expansion) and Windows runners default to pwsh.
        shell: bash
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        run: |
          # Must match the Rust side's `release` string exactly (src-tauri/src/lib.rs's
          # init_telemetry) and the JS SDK's (src/lib/telemetry.ts's initTelemetry) --
          # otherwise traces from one side won't symbolicate against these maps.
          npx --yes @sentry/cli sourcemaps upload \
            --release "agentpanel@${GITHUB_REF_NAME#v}" \
            dist

      - name: Build the app
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS code signing + notarization. No-ops on Windows and on macOS
          # if these secrets are unset (falls back to the current ad-hoc/unsigned build).
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Compiled in as `option_env!("AGENTPANEL_SENTRY_DSN")` (src-tauri/src/lib.rs).
          # Empty-if-unset keeps forks (no access to this secret) fail-closed --
          # they still build releases, just with telemetry compiled inert.
          AGENTPANEL_SENTRY_DSN: ${{ secrets.AGENTPANEL_SENTRY_DSN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "AgentPanel ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  # The updater looks up an exact `{os}-{arch}` key in latest.json and has no
  # fallback (tauri-plugin-updater's updater.rs). A key missing from the merged
  # manifest means that platform silently stops receiving updates, so fail the
  # release loudly while it is still an unpublished draft.
  verify-manifest:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check latest.json covers every shipped platform
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # `GET /releases/tags/{tag}` omits drafts, so list and match instead.
          assets=$(gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate --jq \
            ".[] | select(.tag_name == \"${GITHUB_REF_NAME}\") | .assets[] | select(.name == \"latest.json\") | .url")
          count=$(printf '%s\n' "$assets" | grep -c '^https' || true)
          if [ "$count" -eq 0 ]; then
            echo "::error::no latest.json asset on the ${GITHUB_REF_NAME} release"
            exit 1
          fi
          # More than one means the build legs raced and each wrote a partial
          # manifest -- the v0.6.0 failure. strategy.max-parallel is meant to
          # prevent it; if this fires, that serialization has regressed.
          if [ "$count" -gt 1 ]; then
            echo "::error::${count} assets named latest.json on the ${GITHUB_REF_NAME} release -- the build legs raced and each wrote a partial manifest. Check strategy.max-parallel, delete the release, and re-run every leg."
            exit 1
          fi
          asset="$assets"
          curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" \
                    -H "Accept: application/octet-stream" "$asset" -o latest.json
          cat latest.json
          fail=0
          for key in darwin-aarch64 darwin-x86_64 windows-x86_64; do
            if ! jq -e --arg k "$key" '.platforms[$k].url' latest.json >/dev/null; then
              echo "::error::latest.json is missing the '$key' platform entry"
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "Do not publish this draft — those users would never see an update."
            exit 1
          fi
          echo "latest.json covers all three platforms."
